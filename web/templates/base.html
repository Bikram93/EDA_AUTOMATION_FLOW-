<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EDA Flow Automation{% endblock %}</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Cytoscape.js for DAG Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <a href="{{ url_for('dashboard') }}" class="navbar-brand">
            <span class="brand-chip">VLSI</span>
            EDA Flow Orchestrator
        </a>
        <nav class="navbar-nav">
            <a href="{{ url_for('dashboard') }}" class="nav-link">Dashboard</a>
            <a href="https://github.com/Bikram93/EDA_AUTOMATION_FLOW-" target="_blank" class="nav-link">GitHub</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Frontend Orchestration Script -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
